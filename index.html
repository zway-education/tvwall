<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./icon-192.png">
  <title>K12 電視牆 15 頁整合 HTML 預覽</title>
  <style>
    :root {
      --navy: #083d6f;
      --blue: #176cc0;
      --orange: #ed762d;
      --yellow: #f4bc36;
      --paper: #fffdf7;
      --ink: #163a57;
      --activity-green: #25765d;
      --activity-orange: #f4772b;
      --activity-yellow: #ffc84d;
      --activity-ink: #334f46;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #081828;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -540px;
      margin-left: -960px;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform: scale(var(--scale, 1));
      border-radius: 2px;
      background: var(--paper);
      box-shadow: 0 34px 100px rgba(0, 0, 0, .42);
      transform-origin: center;
    }

    .slide-host,
    .slide {
      position: absolute;
      inset: 0;
    }

    .slide {
      opacity: 0;
      transform: translateX(34px);
      transition: opacity 480ms ease, transform 620ms cubic-bezier(.2, .8, .2, 1);
      pointer-events: none;
    }

    .slide.is-active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .capture {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .capture--bright {
      filter: brightness(1.18) saturate(1.08) contrast(1.03);
    }

    .capture--warm-bright {
      filter: brightness(1.28) saturate(.72) contrast(.98);
    }

    .restored-line-panel {
      position: absolute;
      z-index: 2;
      top: var(--frame-top);
      left: var(--panel-center-x);
      width: var(--frame-width);
      transform: translateX(-50%);
      filter: none;
      text-align: center;
    }

    .restored-line-frame {
      display: grid;
      width: 100%;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border-radius: var(--frame-radius);
      background: #fff;
    }

    .restored-line-qr {
      display: block;
      width: var(--qr-size);
      height: var(--qr-size);
      object-fit: contain;
    }

    .restored-line-cta {
      display: block;
      width: max-content;
      max-width: 100%;
      margin-inline: auto;
      font-weight: 850;
      line-height: 1.15;
      white-space: nowrap;
    }

    .restored-line-cta--primary {
      margin-top: 22px;
      color: #e7f4e8;
      font-size: 24px;
      letter-spacing: .14em;
    }

    .restored-line-cta--secondary {
      margin-top: 17px;
      color: #d8ad52;
      font-size: 31px;
      letter-spacing: .08em;
    }

    .restored-line-panel--old-1 {
      --panel-center-x: 1534px;
      --frame-top: 294px;
      --frame-width: 380px;
      --frame-radius: 17px;
      --qr-size: 290px;
    }

    .restored-line-panel--old-5 {
      --panel-center-x: 1584px;
      --frame-top: 319px;
      --frame-width: 443px;
      --frame-radius: 13px;
      --qr-size: 310px;
      isolation: isolate;
    }

    .restored-line-panel--old-5::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: 440px;
      left: 50%;
      width: 350px;
      height: 132px;
      border-radius: 30px;
      background: #f6da9a;
      box-shadow: 0 10px 24px rgba(58, 45, 20, .18);
      transform: translateX(-50%);
    }

    .restored-line-panel--old-5 .restored-line-cta--primary {
      position: relative;
      z-index: 1;
      visibility: visible;
      margin-top: 12px;
      padding: 8px 24px;
      border-radius: 999px;
      background: #08633f;
      box-shadow: 0 7px 18px rgba(2, 48, 31, .2);
      color: #fffdf5;
      font-size: 22px;
    }

    .restored-line-panel--old-5 .restored-line-cta--secondary {
      position: relative;
      z-index: 1;
      visibility: visible;
      margin-top: 8px;
      padding: 9px 26px;
      border-radius: 999px;
      background: #ffe4a0;
      box-shadow: 0 7px 18px rgba(2, 48, 31, .16);
      color: #07583a;
      font-size: 27px;
    }

    .expert-slide {
      display: flex;
      flex-direction: column;
      padding: 66px 82px 76px;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 209, 91, .18), transparent 25%),
        linear-gradient(135deg, #fffdf7, #f3f8ed);
      color: #153f31;
    }

    .expert-slide::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 4px solid rgba(31, 138, 92, .17);
      border-radius: 38px;
      pointer-events: none;
    }

    .expert-heading {
      position: relative;
      z-index: 2;
      margin: 0;
      color: #174d39;
      font-size: 58px;
      line-height: 1.16;
      letter-spacing: -.03em;
    }

    .expert-heading strong {
      margin-left: .32em;
      color: #2d956d;
    }

    .expert-heading::after {
      content: "";
      display: block;
      width: 44px;
      height: 4px;
      margin-top: 18px;
      background: #d5a846;
    }

    .expert-rows {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 26px;
      margin-top: 36px;
    }

    .expert-row {
      display: grid;
      gap: 18px;
      margin-inline: auto;
    }

    .expert-row--top {
      width: 100%;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .expert-row--bottom {
      width: 76%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .expert-card {
      display: flex;
      min-width: 0;
      height: 356px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 17px 14px;
      border: 2px solid rgba(31, 138, 92, .16);
      border-radius: 20px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 28px rgba(14, 99, 64, .1);
      text-align: center;
    }

    .expert-card img {
      width: 142px;
      height: 142px;
      margin: 24px 0 14px;
      border: 4px solid #d8aa4a;
      border-radius: 50%;
      background: #f2ead7;
      object-fit: cover;
    }

    .expert-card h2 {
      margin: 0;
      color: #174d39;
      font-size: 34px;
      line-height: 1.15;
    }

    .expert-card p {
      margin: 9px 0 0;
      color: #4c6259;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.42;
    }

    .prototype-chip {
      position: absolute;
      z-index: 30;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px 11px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 999px;
      background: rgba(7, 38, 66, .78);
      box-shadow: 0 9px 24px rgba(0, 0, 0, .18);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .12em;
      backdrop-filter: blur(12px);
    }

    .activity {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 54px;
      padding: 72px 84px 82px;
      background:
        radial-gradient(circle at 14% 10%, rgba(255, 200, 77, .32), transparent 28%),
        radial-gradient(circle at 90% 88%, rgba(37, 118, 93, .2), transparent 28%),
        linear-gradient(135deg, #fffdf7 0%, #f7fbf2 58%, #edf7e9 100%);
      color: var(--activity-ink);
    }

    .activity::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 4px solid rgba(37, 118, 93, .24);
      border-radius: 38px;
      pointer-events: none;
    }

    .activity__copy {
      position: relative;
      z-index: 2;
      align-self: center;
    }

    .activity__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding: 10px 19px;
      border: 3px solid var(--activity-orange);
      border-radius: 999px;
      color: var(--activity-green);
      background: #fff7da;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .activity__eyebrow::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--activity-orange);
    }

    .activity-name {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 10px 20px;
      border: 3px solid var(--activity-orange);
      border-radius: 999px;
      color: var(--activity-green);
      background: #fff2c7;
      font-size: 35px;
      font-weight: 950;
      letter-spacing: .035em;
    }

    .activity-name::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--activity-orange);
    }

    .activity .activity-title {
      max-width: 960px;
      color: var(--activity-ink);
      font-size: 92px;
      line-height: 1.02;
      letter-spacing: -.055em;
    }

    .activity-tagline {
      margin: 22px 0 0;
      color: var(--activity-orange);
      font-size: 33px;
      font-weight: 950;
      line-height: 1.38;
    }

    .feature-list {
      display: grid;
      gap: 13px;
      margin-top: 27px;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      min-height: 61px;
      padding: 12px 20px;
      border: 2px solid rgba(37, 118, 93, .2);
      border-radius: 17px;
      background: rgba(255, 255, 255, .9);
      color: var(--activity-ink);
      font-size: 27px;
      font-weight: 900;
      box-shadow: 7px 8px 0 rgba(37, 118, 93, .05);
    }

    .feature-pill::before {
      content: "✓";
      display: grid;
      flex: 0 0 auto;
      width: 35px;
      height: 35px;
      margin-right: 13px;
      place-items: center;
      border-radius: 50%;
      background: var(--activity-yellow);
      color: var(--activity-ink);
      font-size: 20px;
      font-weight: 950;
    }

    .activity h1 {
      margin: 0;
      color: var(--activity-ink);
      font-size: 72px;
      line-height: 1.12;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .activity h1 strong {
      display: block;
      margin-top: 10px;
      color: var(--activity-orange);
    }

    .activity__lead {
      max-width: 900px;
      margin: 28px 0 0;
      color: var(--activity-ink);
      font-size: 31px;
      font-weight: 700;
      line-height: 1.62;
    }

    .benefits {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    .benefit {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 68px;
      padding: 13px 17px;
      border: 2px solid rgba(18, 106, 175, .2);
      border-radius: 18px;
      background: rgba(255, 255, 255, .86);
      color: var(--navy);
      font-size: 24px;
      font-weight: 900;
    }

    .benefit span {
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--navy);
    }

    .activity__poster {
      position: relative;
      z-index: 2;
      align-self: center;
      justify-self: center;
      width: min(100%, 610px);
      max-height: 900px;
      object-fit: contain;
      border: 10px solid #fff;
      border-radius: 28px;
      box-shadow: 22px 26px 0 rgba(23, 108, 175, .14), 0 28px 70px rgba(8, 61, 111, .24);
      transform: rotate(1.1deg);
    }

    .activity--routes {
      display: block;
      padding: 52px 70px 66px;
    }

    .routes-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 30px;
    }

    .routes-header h1 {
      max-width: 980px;
      font-size: 58px;
    }

    .routes-header p {
      margin: 0 0 9px;
      color: var(--activity-ink);
      font-size: 27px;
      font-weight: 800;
    }

    .route-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 18px;
      margin-top: 20px;
    }

    .route {
      position: relative;
      min-height: 144px;
      padding: 20px 24px 20px 152px;
      overflow: hidden;
      border: 3px solid rgba(37, 118, 93, .23);
      border-radius: 25px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 10px 12px 0 rgba(37, 118, 93, .07);
    }

    .route:nth-child(2n) {
      border-color: rgba(244, 119, 43, .3);
      background: rgba(255, 248, 224, .94);
    }

    .route__date {
      position: absolute;
      inset: 0 auto 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 128px;
      box-sizing: border-box;
      padding: 0 12px;
      background: var(--activity-green);
      color: #fff;
      font-size: 27px;
      font-weight: 950;
      line-height: 1.2;
      text-align: center;
      writing-mode: horizontal-tb;
    }

    .route:nth-child(2n) .route__date {
      background: var(--activity-orange);
    }

    .route h2 {
      margin: 0;
      color: var(--activity-ink);
      font-size: 31px;
      line-height: 1.2;
    }

    .route p {
      margin: 8px 0 0;
      color: var(--activity-ink);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.42;
    }

    .speaker-band {
      margin-top: 19px;
      padding: 16px 19px 15px;
      border: 3px solid rgba(37, 118, 93, .18);
      border-radius: 22px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 10px 12px 0 rgba(37, 118, 93, .06);
    }

    .speaker-band h2 {
      margin: 0 0 11px;
      color: var(--activity-ink);
      font-size: 27px;
      letter-spacing: .08em;
    }

    .speaker-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .speaker-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 148px;
      padding: 10px 13px;
      border-radius: 15px;
      background: #eef7eb;
      color: var(--activity-ink);
      border-left: 8px solid var(--activity-green);
    }

    .speaker-card--orange {
      background: #fff4d7;
      border-left-color: var(--activity-orange);
    }

    .speaker-photo {
      position: relative;
      display: block;
      flex: 0 0 112px;
      width: 112px;
      height: 128px;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 16px;
      background: #dcebe1;
      box-shadow: 0 4px 10px rgba(37, 118, 93, .16);
    }

    .speaker-photo img {
      position: absolute;
      display: block;
      max-width: none;
      height: auto;
    }

    .speaker-photo--chen img {
      width: 184px;
      left: -36px;
      top: -33px;
    }

    .speaker-photo--wang img {
      width: 655px;
      left: -189px;
      top: -39px;
    }

    .speaker-photo--zhang img {
      width: 457px;
      left: -207px;
      top: -191px;
    }

    .speaker-photo--tang img {
      width: 285px;
      left: -86px;
      top: -30px;
    }

    .speaker-copy {
      min-width: 0;
    }

    .speaker-card b {
      display: block;
      font-size: 29px;
      line-height: 1.1;
    }

    .speaker-copy span {
      display: block;
      margin-top: 7px;
      color: var(--activity-ink);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
    }

    .speaker-band > p {
      margin: 11px 0 0;
      color: var(--activity-ink);
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }

    .activity--cta {
      grid-template-columns: 1fr 525px;
      gap: 65px;
    }

    .outcome-tags {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    .outcome-tag {
      display: grid;
      grid-template-columns: max-content 1fr;
      align-items: baseline;
      gap: 14px;
      min-height: 64px;
      padding: 13px 18px;
      border: 2px solid transparent;
      border-radius: 14px;
      color: var(--activity-ink);
    }

    .outcome-tag strong {
      font-size: 25px;
      font-weight: 950;
      line-height: 1.2;
    }

    .outcome-tag span {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.35;
    }

    .outcome-tag--green {
      border-color: rgba(37, 118, 93, .3);
      background: #eaf7ea;
    }

    .outcome-tag--green strong {
      color: #1c7758;
    }

    .outcome-tag--orange {
      border-color: rgba(244, 119, 43, .34);
      background: #fff0df;
    }

    .outcome-tag--orange strong {
      color: #df6527;
    }

    .outcome-tag--yellow {
      border-color: rgba(211, 155, 25, .34);
      background: #fff7ce;
    }

    .outcome-tag--yellow strong {
      color: #a96d00;
    }

    .activity--cta h1 {
      font-size: 78px;
      line-height: 1.04;
    }

    .activity--cta .activity__lead {
      font-size: 30px;
      line-height: 1.5;
    }

    .activity-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
    }

    .activity-facts span {
      padding: 9px 12px;
      border-radius: 999px;
      background: #fff2c7;
      color: var(--activity-ink);
      font-size: 18px;
      font-weight: 850;
    }

    .cta-quote {
      margin: 26px 0 0;
      padding: 22px 26px;
      border-left: 7px solid var(--activity-yellow);
      border-radius: 5px 22px 22px 5px;
      background: rgba(255, 255, 255, .78);
      color: var(--activity-ink);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.6;
    }

    .assessment-gift {
      margin-top: 24px;
      padding: 19px 24px;
      border: 3px solid rgba(244, 119, 43, .28);
      border-radius: 21px;
      background: #fff2c2;
      color: var(--activity-ink);
      font-size: 25px;
      font-weight: 900;
      line-height: 1.45;
    }

    .signup-panel {
      position: relative;
      z-index: 2;
      align-self: center;
      padding: 33px;
      border: 4px solid var(--activity-orange);
      border-radius: 34px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 18px 22px 0 rgba(244, 119, 43, .12);
      text-align: center;
      text-decoration: none;
    }

    .signup-panel img {
      width: 320px;
      height: 320px;
      padding: 15px;
      border: 2px solid rgba(37, 118, 93, .18);
      border-radius: 20px;
      background: #fff;
    }

    .signup-panel strong {
      display: block;
      margin-top: 20px;
      color: var(--activity-green);
      font-size: 37px;
    }

    .signup-panel span {
      display: block;
      margin-top: 9px;
      color: var(--activity-orange);
      font-size: 26px;
      font-weight: 900;
    }

    .signup-panel small {
      display: block;
      margin-top: 10px;
      color: var(--activity-ink);
      font-size: 21px;
      font-weight: 700;
    }

    .focus-event {
      --focus-green: #27836a;
      --focus-green-dark: #24614f;
      --focus-orange: #f17638;
      --focus-yellow: #f8c94f;
      --focus-ink: #355d51;
      display: grid;
      grid-template-columns: 610px minmax(0, 1fr);
      gap: 62px;
      padding: 68px 76px 72px;
      overflow: hidden;
      background:
        radial-gradient(circle at 91% 8%, rgba(255, 199, 72, .34), transparent 25%),
        radial-gradient(circle at 8% 93%, rgba(51, 169, 155, .2), transparent 26%),
        linear-gradient(135deg, #fffdf4 0%, #fff9e8 49%, #edf9ed 100%);
      color: var(--focus-ink);
    }

    .focus-event::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 4px solid rgba(39, 131, 106, .24);
      border-radius: 38px;
      pointer-events: none;
    }

    .focus-event__poster-wrap {
      position: relative;
      z-index: 2;
      align-self: center;
    }

    .focus-event__poster-wrap::before {
      content: "";
      position: absolute;
      inset: 26px -22px -22px 26px;
      border-radius: 32px;
      background: var(--focus-yellow);
      transform: rotate(-1.5deg);
    }

    .focus-event__poster {
      position: relative;
      display: block;
      width: 610px;
      height: 862px;
      border: 9px solid #fff;
      border-radius: 30px;
      object-fit: cover;
      box-shadow: 0 28px 60px rgba(75, 111, 86, .22);
      transform: rotate(.7deg);
    }

    .focus-event__poster-qr-mask {
      position: absolute;
      z-index: 4;
      top: 540px;
      left: 300px;
      display: grid;
      width: 225px;
      height: 200px;
      box-sizing: border-box;
      place-items: center;
      padding: 24px;
      border: 5px solid var(--focus-green);
      border-radius: 26px;
      background: #fff5cf;
      box-shadow: 0 16px 28px rgba(36, 97, 79, .22);
      color: var(--focus-green-dark);
      font-size: 27px;
      font-weight: 950;
      line-height: 1.35;
      text-align: center;

  <script>
    const legacyItems = [
      { kind: "image", src: "./old-1.png", label: "舊電視牆 1/5", duration: 9000 },
      { kind: "image", src: "./old-2.png", label: "舊電視牆 2/5", duration: 9000 },
      { kind: "template", id: "expertTemplate", label: "舊電視牆 3/5", duration: 9000 },
      { kind: "image", src: "./old-4.png", label: "舊電視牆 4/5", duration: 9000 },
      { kind: "image", src: "./old-5.png", label: "舊電視牆 5/5", duration: 9000 }
    ];

    const items = [
      ...legacyItems,
      ...Array.from({ length: 6 }, (_, index) => ({
        kind: "image",
        src: index === 0
          ? "./new-1.png?v=20260727-core-copy"
          : `./new-${index + 1}.png`,
        label: `SEL 招生 ${index + 1}/6`,
        duration: 9000
      })),
      { kind: "template", id: "activityIntro", label: "成大活動 1/3", duration: 11000 },
      { kind: "template", id: "activityRoutes", label: "成大活動 2/3", duration: 12000 },
      { kind: "template", id: "activitySignup", label: "成大活動 3/3", duration: 11000 },
      { kind: "template", id: "focusEvent", label: "親子體驗活動 1/1", duration: 12000 }
    ];

    const stage = document.getElementById("stage");
    const host = document.getElementById("slideHost");
    const progress = document.getElementById("progress");
    const restoredQrModifierByLegacyIndex = {
      0: "restored-line-panel--old-1",
      4: "restored-line-panel--old-5"
    };

    let current = 11;
    let timer = null;
    let paused = false;

    function fit() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.setProperty("--scale", String(scale));
    }

    function buildSlides() {
      items.forEach((item, index) => {
        let slide;
        if (item.kind === "image") {
          slide = document.createElement("section");
          slide.className = "slide";
          const image = document.createElement("img");
          image.className = "capture";
          image.src = item.src;
          image.alt = item.label;
          if (index === 0) image.classList.add("capture--bright");
          if (index === 4) image.classList.add("capture--warm-bright");
          slide.appendChild(image);
          if (index === 0 || index === 4) {
            const panel = document.createElement("div");
            panel.className = `restored-line-panel ${restoredQrModifierByLegacyIndex[index]}`;
            const frame = document.createElement("span");
            frame.className = "restored-line-frame";
            const qr = document.createElement("img");
            qr.className = "restored-line-qr";
            qr.src = "./line-qr.png";
            qr.alt = "LINE 加好友 QR Code";
            const primary = document.createElement("span");
            primary.className = "restored-line-cta restored-line-cta--primary";
            primary.textContent = "加 LINE 好友";
            const secondary = document.createElement("span");
            secondary.className = "restored-line-cta restored-line-cta--secondary";
            secondary.textContent = "與我們聊一聊";
            frame.appendChild(qr);
            panel.append(frame, primary, secondary);
            slide.appendChild(panel);
          }
        } else {
          slide = document.getElementById(item.id).content.firstElementChild.cloneNode(true);
        }
        slide.dataset.index = String(index);
        host.appendChild(slide);
      });
    }

    function schedule() {
      clearTimeout(timer);
      progress.classList.remove("is-running");
      void progress.offsetWidth;
      if (paused) return;
      progress.style.setProperty("--duration", `${items[current].duration}ms`);
      progress.classList.add("is-running");
      timer = setTimeout(() => show(current + 1), items[current].duration);
    }

    function show(index) {
      const slides = [...host.querySelectorAll(".slide")];
      current = (index + items.length) % items.length;
      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle("is-active", slideIndex === current);
        slide.setAttribute("aria-hidden", slideIndex === current ? "false" : "true");
      });
      schedule();
    }

    function togglePause() {
      paused = !paused;
      schedule();
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      }
    });

    window.addEventListener("resize", fit);
    buildSlides();
    fit();
    show(current);
  </script>
