<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link rel="icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <title>K12 電視牆 15 頁整合 HTML 預覽</title>
  <style>
    :root {
      --navy: #083d6f;
      --blue: #176cc0;
      --orange: #ed762d;
      --yellow: #f4bc36;
      --paper: #fffdf7;
      --ink: #163a57;
      --activity-green: #25765d;
      --activity-orange: #f4772b;
      --activity-yellow: #ffc84d;
      --activity-ink: #334f46;
      --legacy-green-deep: #073b22;
      --legacy-green-mid: #1d5b3f;
      --legacy-green-bright: #0b5334;
      --legacy-gold: #e5be64;
      --legacy-cream: #fffaf0;
      --tv-supporting-size: 24px;
      --tv-body-size: 28px;
      --tv-title-size: 68px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .tv-viewport {
      position: fixed;
      inset: 0;
      display: grid;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      place-items: center;
      background: var(--paper);
    }

    .stage-frame {
      position: relative;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      transform: scale(var(--scale, 1));
      border-radius: 0;
      background: var(--paper);
      box-shadow: none;
      transform-origin: top left;
    }

    .slide-host,
    .slide {
      position: absolute;
      inset: 0;
    }

    .slide {
      opacity: 0;
      transform: translateX(34px);
      transition: opacity 480ms ease, transform 620ms cubic-bezier(.2, .8, .2, 1);
      pointer-events: none;
    }

    .slide.is-active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .capture {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide--captured-controls::after {
      content: "";
      position: absolute;
      z-index: 3;
      right: 0;
      bottom: 0;
      left: 0;
      height: 58px;
      background: linear-gradient(180deg, rgba(255, 253, 247, .94), var(--paper) 34%, var(--paper));
      pointer-events: none;
    }

    .capture-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: var(--paper);
    }

    .capture--bright {
      filter: brightness(1.18) saturate(1.08) contrast(1.03);
    }

    .capture--warm-bright {
      filter: brightness(1.28) saturate(.72) contrast(.98);
    }

    .restored-line-panel {
      position: absolute;
      z-index: 2;
      top: var(--frame-top);
      left: var(--panel-center-x);
      width: var(--frame-width);
      transform: translateX(-50%);
      filter: none;
      text-align: center;
    }

    .restored-line-frame {
      display: grid;
      width: 100%;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border-radius: var(--frame-radius);
      background: #fff;
    }

    .restored-line-qr {
      display: block;
      width: var(--qr-size);
      height: var(--qr-size);
      object-fit: contain;
    }

    .restored-line-cta {
      display: block;
      width: max-content;
      max-width: 100%;
      margin-inline: auto;
      font-weight: 850;
      line-height: 1.15;
      white-space: nowrap;
    }

    .restored-line-cta--primary {
      margin-top: 22px;
      color: #e7f4e8;
      font-size: 24px;
      letter-spacing: .14em;
    }

    .restored-line-cta--secondary {
      margin-top: 17px;
      color: #d8ad52;
      font-size: 31px;
      letter-spacing: .08em;
    }

    .restored-line-panel--old-1 {
      --panel-center-x: 1534px;
      --frame-top: 294px;
      --frame-width: 380px;
      --frame-radius: 17px;
      --qr-size: 340px;
      isolation: isolate;
    }

    .restored-line-panel--old-1::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: 387px;
      left: 50%;
      width: 430px;
      height: 130px;
      border-radius: 26px;
      background: linear-gradient(90deg, #0b5335, #0c5b3a);
      box-shadow: 0 10px 24px rgba(1, 40, 25, .24);
      transform: translateX(-50%);
    }

    .restored-line-panel--old-1 .restored-line-cta--primary,
    .restored-line-panel--old-1 .restored-line-cta--secondary {
      position: relative;
      z-index: 1;
      visibility: visible;
    }

    .restored-line-panel--old-5 {
      --panel-center-x: 1584px;
      --frame-top: 319px;
      --frame-width: 443px;
      --frame-radius: 13px;
      --qr-size: 360px;
      isolation: isolate;
    }

    .restored-line-panel--old-5::after {
      content: "";
      position: absolute;
      z-index: 0;
      top: 440px;
      left: 50%;
      width: 350px;
      height: 132px;
      border-radius: 30px;
      background: #f6da9a;
      box-shadow: 0 10px 24px rgba(58, 45, 20, .18);
      transform: translateX(-50%);
    }

    .restored-line-panel--old-5 .restored-line-cta--primary {
      position: relative;
      z-index: 1;
      visibility: visible;
      margin-top: 12px;
      padding: 8px 24px;
      border-radius: 999px;
      background: #08633f;
      box-shadow: 0 7px 18px rgba(2, 48, 31, .2);
      color: #fffdf5;
      font-size: 22px;
    }

    .restored-line-panel--old-5 .restored-line-cta--secondary {
      position: relative;
      z-index: 1;
      visibility: visible;
      margin-top: 8px;
      padding: 9px 26px;
      border-radius: 999px;
      background: #ffe4a0;
      box-shadow: 0 7px 18px rgba(2, 48, 31, .16);
      color: #07583a;
      font-size: 27px;
    }

    .expert-slide {
      display: flex;
      flex-direction: column;
      padding: 66px 82px 76px;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 209, 91, .18), transparent 25%),
        linear-gradient(135deg, #fffdf7, #f3f8ed);
      color: #153f31;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    .expert-slide::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 4px solid rgba(31, 138, 92, .17);
      border-radius: 38px;
      pointer-events: none;
    }

    .expert-heading {
      position: relative;
      z-index: 2;
      margin: 0;
      color: #174d39;
      font-size: 58px;
      line-height: 1.16;
      letter-spacing: -.03em;
    }

    .expert-heading strong {
      margin-left: .32em;
      color: #2d956d;
    }

    .expert-heading::after {
      content: "";
      display: block;
      width: 44px;
      height: 4px;
      margin-top: 18px;
      background: #d5a846;
    }

    .expert-rows {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 26px;
      margin-top: 36px;
    }

    .expert-row {
      display: grid;
      gap: 18px;
      margin-inline: auto;
    }

    .expert-row--top {
      width: 100%;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .expert-row--bottom {
      width: 76%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .expert-card {
      display: flex;
      min-width: 0;
      height: 356px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 17px 14px;
      border: 2px solid rgba(31, 138, 92, .16);
      border-radius: 20px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 28px rgba(14, 99, 64, .1);
      text-align: center;
    }

    .expert-card img {
      width: 142px;
      height: 142px;
      margin: 24px 0 14px;
      border: 4px solid #d8aa4a;
      border-radius: 50%;
      background: #f2ead7;
      object-fit: cover;
    }

    .expert-card h2 {
      margin: 0;
      color: #174d39;
      font-size: 34px;
      line-height: 1.15;
    }

    .expert-card p {
      margin: 9px 0 0;
      color: #4c6259;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.42;
    }

    .prototype-chip {
      position: absolute;
      z-index: 30;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px 11px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 999px;
      background: rgba(7, 38, 66, .78);
      box-shadow: 0 9px 24px rgba(0, 0, 0, .18);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .12em;
      backdrop-filter: blur(12px);
    }

    .activity {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 54px;
      padding: 72px 84px 82px;
      background:
        radial-gradient(circle at 14% 10%, rgba(255, 200, 77, .32), transparent 28%),
        radial-gradient(circle at 90% 88%, rgba(37, 118, 93, .2), transparent 28%),
        linear-gradient(135deg, #fffdf7 0%, #f7fbf2 58%, #edf7e9 100%);
      color: var(--activity-ink);
    }

    .activity::before {
      content: "";
      position: absolute;
      inset: 20px;
      border: 4px solid rgba(37, 118, 93, .24);
      border-radius: 38px;
      pointer-events: none;
    }

    .activity__copy {
      position: relative;
      z-index: 2;
      align-self: center;
    }

    .activity__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding: 10px 19px;
      border: 3px solid var(--activity-orange);
      border-radius: 999px;
      color: var(--activity-green);
      background: #fff7da;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .activity__eyebrow::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--activity-orange);
    }

    .activity-name {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 10px 20px;
      border: 3px solid var(--activity-orange);
      border-radius: 999px;
      color: var(--activity-green);
      background: #fff2c7;
      font-size: 35px;
      font-weight: 950;
      letter-spacing: .035em;
    }

    .activity-name::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--activity-orange);
    }

    .activity .activity-title {
      max-width: 960px;
      color: var(--activity-ink);
      font-size: 92px;
      line-height: 1.02;
      letter-spacing: -.055em;
    }

    .activity-tagline {
      margin: 22px 0 0;
      color: var(--activity-orange);
      font-size: 33px;
      font-weight: 950;
      line-height: 1.38;
    }

    .feature-list {
      display: grid;
      gap: 13px;
      margin-top: 27px;
    }

    .feature-pill {
      display: flex;
      align-items: center;
      min-height: 61px;
      padding: 12px 20px;
      border: 2px solid rgba(37, 118, 93, .2);
      border-radius: 17px;
      background: rgba(255, 255, 255, .9);
      color: var(--activity-ink);
      font-size: 27px;
      font-weight: 900;
      box-shadow: 7px 8px 0 rgba(37, 118, 93, .05);
    }

    .feature-pill::before {
      content: "✓";
      display: grid;
      flex: 0 0 auto;
      width: 35px;
      height: 35px;
      margin-right: 13px;
      place-items: center;
      border-radius: 50%;
      background: var(--activity-yellow);
      color: var(--activity-ink);
      font-size: 20px;
      font-weight: 950;
    }

    .activity h1 {
      margin: 0;
      color: var(--activity-ink);
      font-size: 72px;
      line-height: 1.12;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .activity h1 strong {
      display: block;
      margin-top: 10px;
      color: var(--activity-orange);
    }

    .activity__lead {
      max-width: 900px;
      margin: 28px 0 0;
      color: var(--activity-ink);
      font-size: 31px;
      font-weight: 700;
      line-height: 1.62;
    }

    .benefits {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    .benefit {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 68px;
      padding: 13px 17px;
      border: 2px solid rgba(18, 106, 175, .2);
      border-radius: 18px;
      background: rgba(255, 255, 255, .86);
      color: var(--navy);
      font-size: 24px;
      font-weight: 900;
    }

    .benefit span {
      display: grid;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--navy);
    }

    .activity__poster {
      position: relative;
      z-index: 2;
      align-self: center;
      justify-self: center;
      width: min(100%, 610px);
      max-height: 900px;
      object-fit: contain;
      border: 10px solid #fff;
      border-radius: 28px;
      box-shadow: 22px 26px 0 rgba(23, 108, 175, .14), 0 28px 70px rgba(8, 61, 111, .24);
      transform: rotate(1.1deg);
    }

    .activity--routes {
      display: block;
      padding: 52px 70px 66px;
    }

    .routes-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 30px;
    }

    .routes-header h1 {
      max-width: 980px;
      font-size: 58px;
    }

    .routes-header p {
      margin: 0 0 9px;
      color: var(--activity-ink);
      font-size: 27px;
      font-weight: 800;
    }

    .route-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 18px;
      margin-top: 20px;
    }

    .route {
      position: relative;
      min-height: 144px;
      padding: 20px 24px 20px 152px;
      overflow: hidden;
      border: 3px solid rgba(37, 118, 93, .23);
      border-radius: 25px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 10px 12px 0 rgba(37, 118, 93, .07);
    }

    .route:nth-child(2n) {
      border-color: rgba(244, 119, 43, .3);
      background: rgba(255, 248, 224, .94);
    }

    .route__date {
      position: absolute;
      inset: 0 auto 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 128px;
      box-sizing: border-box;
      padding: 0 12px;
      background: var(--activity-green);
      color: #fff;
      font-size: 27px;
      font-weight: 950;
      line-height: 1.2;
      text-align: center;
      writing-mode: horizontal-tb;
    }

    .route:nth-child(2n) .route__date {
      background: var(--activity-orange);
    }

    .route h2 {
      margin: 0;
      color: var(--activity-ink);
      font-size: 31px;
      line-height: 1.2;
    }

    .route p {
      margin: 8px 0 0;
      color: var(--activity-ink);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.42;
    }

    .speaker-band {
      margin-top: 19px;
      padding: 16px 19px 15px;
      border: 3px solid rgba(37, 118, 93, .18);
      border-radius: 22px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 10px 12px 0 rgba(37, 118, 93, .06);
    }

    .speaker-band h2 {
      margin: 0 0 11px;
      color: var(--activity-ink);
      font-size: 27px;
      letter-spacing: .08em;
    }

    .speaker-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .speaker-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 148px;
      padding: 10px 13px;
      border-radius: 15px;
      background: #eef7eb;
      color: var(--activity-ink);
      border-left: 8px solid var(--activity-green);
    }

    .speaker-card--orange {
      background: #fff4d7;
      border-left-color: var(--activity-orange);
    }

    .speaker-photo {
      position: relative;
      display: block;
      flex: 0 0 112px;
      width: 112px;
      height: 128px;
      overflow: hidden;
      border: 3px solid #fff;
      border-radius: 16px;
      background: #dcebe1;
      box-shadow: 0 4px 10px rgba(37, 118, 93, .16);
    }

    .speaker-photo img {
      position: absolute;
      display: block;
      max-width: none;
      height: auto;
    }

    .speaker-photo--chen img {
      width: 184px;
      left: -36px;
      top: -33px;
    }

    .speaker-photo--wang img {
      width: 655px;
      left: -189px;
      top: -39px;
    }

    .speaker-photo--zhang img {
      width: 457px;
      left: -207px;
      top: -191px;
    }

    .speaker-photo--tang img {
      width: 285px;
      left: -86px;
      top: -30px;
    }

    .speaker-copy {
      min-width: 0;
    }

    .speaker-card b {
      display: block;
      font-size: 29px;
      line-height: 1.1;
    }

    .speaker-copy span {
      display: block;
      margin-top: 7px;
      color: var(--activity-ink);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
    }

    .speaker-band > p {
      margin: 11px 0 0;
      color: var(--activity-ink);
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }

    .activity--cta {
      grid-template-columns: 1fr 525px;
      gap: 65px;
    }

    .outcome-tags {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    .outcome-tag {
      display: grid;
      grid-template-columns: max-content 1fr;
      align-items: baseline;
      gap: 14px;
      min-height: 64px;
      padding: 13px 18px;
      border: 2px solid transparent;
      border-radius: 14px;
      color: var(--activity-ink);
    }

    .outcome-tag strong {
      font-size: 25px;
      font-weight: 950;
      line-height: 1.2;
    }

    .outcome-tag span {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.35;
    }

    .outcome-tag--green {
      border-color: rgba(37, 118, 93, .3);
      background: #eaf7ea;
    }

    .outcome-tag--green strong {
      color: #1c7758;
    }

    .outcome-tag--orange {
      border-color: rgba(244, 119, 43, .34);
      background: #fff0df;
    }

    .outcome-tag--orange strong {
      color: #df6527;
    }

    .outcome-tag--yellow {
      border-color: rgba(211, 155, 25, .34);
      background: #fff7ce;
    }

    .outcome-tag--yellow strong {
      color: #a96d00;
    }

    .activity--cta h1 {
      font-size: 78px;
      line-height: 1.04;
    }

    .activity--cta .activity__lead {
      font-size: 30px;
      line-height: 1.5;
    }

    .activity-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
    }

    .activity-facts span {
      padding: 9px 12px;
      border-radius: 999px;
      background: #fff2c7;
      color: var(--activity-ink);
      font-size: 18px;
      font-weight: 850;
    }

    .cta-quote {
      margin: 26px 0 0;
      padding: 22px 26px;
      border-left: 7px solid var(--activity-yellow);
      border-radius: 5px 22px 22px 5px;
      background: rgba(255, 255, 255, .78);
      color: var(--activity-ink);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.6;
    }

    .assessment-gift {
      margin-top: 24px;
      padding: 19px 24px;
      border: 3px solid rgba(244, 119, 43, .28);
      border-radius: 21px;
      background: #fff2c2;
      color: var(--activity-ink);
      font-size: 25px;
      font-weight: 900;
      line-height: 1.45;
    }

    .signup-panel {
      position: relative;
      z-index: 2;
      align-self: center;
      padding: 33px;
      border: 4px solid var(--activity-orange);
      border-radius: 34px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 18px 22px 0 rgba(244, 119, 43, .12);
      text-align: center;
      text-decoration: none;
    }

    .signup-panel img {
      width: 320px;
      height: 320px;
      padding: 15px;
      border: 2px solid rgba(37, 118, 93, .18);
      border-radius: 20px;
      background: #fff;
    }

    .signup-panel strong {
      display: block;
      margin-top: 20px;
      color: var(--activity-green);
      font-size: 37px;
    }

    .signup-panel span {
      display: block;
      margin-top: 9px;
      color: var(--activity-orange);
      font-size: 26px;
      font-weight: 900;
    }

    .signup-panel small {
      display: block;
      margin-top: 10px;
      color: var(--activity-ink);
      font-size: 21px;
      font-weight: 700;
    }

    .focus-event {
      --focus-green: #27836a;
      --focus-green-dark: #24614f;
      --focus-orange: #f17638;
      --focus-yellow: #f8c94f;

      4: "restored-line-panel--old-5"
    };

    const startParam = Number(new URLSearchParams(window.location.search).get("start"));
    let current = Number.isInteger(startParam) && startParam >= 0 && startParam < items.length ? startParam : 13;
    let timer = null;

    function fit() {
      const viewportWidth = viewport.clientWidth;
      const viewportHeight = viewport.clientHeight;
      const scale = Math.min(viewportWidth / 1920, viewportHeight / 1080);
      stage.style.setProperty("--scale", String(scale));
      stageFrame.style.width = `${1920 * scale}px`;
      stageFrame.style.height = `${1080 * scale}px`;
    }

    function buildSlides() {
      items.forEach((item, index) => {
        let slide;
        if (item.kind === "image") {
          slide = document.createElement("section");
          slide.className = "slide";
          const image = document.createElement("img");
          image.className = "capture";
          image.src = item.src;
          image.alt = item.label;
          if (item.src.startsWith("./new-")) slide.classList.add("slide--captured-controls");
          if (index === 0) image.classList.add("capture--bright");
          if (index === 4) image.classList.add("capture--warm-bright");
          slide.appendChild(image);
          if (index === 0 || index === 4) {
            const panel = document.createElement("div");
            panel.className = `restored-line-panel ${restoredQrModifierByLegacyIndex[index]}`;
            const frame = document.createElement("span");
            frame.className = "restored-line-frame";
            const qr = document.createElement("img");
            qr.className = "restored-line-qr";
            qr.src = "./line-qr.png";
            qr.alt = "LINE 加好友 QR Code";
            const primary = document.createElement("span");
            primary.className = "restored-line-cta restored-line-cta--primary";
            primary.textContent = "加 LINE 好友";
            const secondary = document.createElement("span");
            secondary.className = "restored-line-cta restored-line-cta--secondary";
            secondary.textContent = "與我們聊一聊";
            frame.appendChild(qr);
            panel.append(frame, primary, secondary);
            slide.appendChild(panel);
          }
        } else if (item.kind === "video") {
          slide = document.createElement("section");
          slide.className = "slide";
          const video = document.createElement("video");
          video.className = "capture-video";
          video.src = item.src;
          video.preload = "auto";
          video.muted = true;
          video.playsInline = true;
          video.setAttribute("playsinline", "");
          video.setAttribute("webkit-playsinline", "");
          video.setAttribute("aria-label", item.label);
          slide.appendChild(video);
        } else {
          slide = document.getElementById(item.id).content.firstElementChild.cloneNode(true);
        }
        slide.dataset.index = String(index);
        host.appendChild(slide);
      });
    }

    // ===== 輪播守門機制(2026-09-02)=====
    // 問題:影片頁只靠寫死的 setTimeout(144 秒)推進,影片卡住/播完暫停時整面電視就停住。
    // 對策:三道保險 — ①影片 ended/error 立刻換頁 ②影片畫面凍住 10 秒判定卡住 ③全域看門狗。
    let slideToken = 0;              // 每次換頁 +1,用來擋掉舊頁殘留的觸發
    let slideStartedAt = Date.now(); // 這一頁開始的時間(全域看門狗用)
    let stallTimer = null;

    function advance(token) {
      if (token !== slideToken) return;   // 不是當前這頁發出的,忽略
      show(current + 1);
    }

    function schedule() {
      clearTimeout(timer);
      clearInterval(stallTimer);
      slideToken += 1;
      slideStartedAt = Date.now();
      const token = slideToken;
      const item = items[current];
      timer = setTimeout(() => advance(token), item.duration);

      // 影片頁:播完就換、載入失敗就跳過、畫面凍住也跳過
      const video = host.querySelector(".slide.is-active video");
      if (!video) return;
      video.onended = () => advance(token);
      video.onerror = () => advance(token);
      let lastTime = -1;
      let frozenFor = 0;
      stallTimer = setInterval(() => {
        if (token !== slideToken) { clearInterval(stallTimer); return; }
        if (video.ended) { advance(token); return; }
        if (video.currentTime === lastTime && !video.paused) {
          frozenFor += 2;
          if (frozenFor >= 10) advance(token);   // 連續 10 秒沒前進 = 卡住
        } else {
          frozenFor = 0;
          lastTime = video.currentTime;
        }
      }, 2000);
    }

    // 全域看門狗:不管什麼原因(分頁被節流、timer 掉了、影片暫停),
    // 只要這頁停留超過「設定秒數 + 20 秒」就強制換下一頁,電視牆絕不停住。
    setInterval(() => {
      const over = Date.now() - slideStartedAt - items[current].duration;
      if (over > 20000) show(current + 1);
    }, 5000);

    function show(index) {
      const slides = [...host.querySelectorAll(".slide")];
      current = (index + items.length) % items.length;
      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle("is-active", slideIndex === current);
        slide.setAttribute("aria-hidden", slideIndex === current ? "false" : "true");
        const video = slide.querySelector("video");
        if (!video) return;
        if (slideIndex === current) {
          try { video.currentTime = 0; } catch (err) { /* 尚未可 seek,忽略 */ }
          video.muted = true;
          video.loop = false;
          const playback = video.play();
          if (playback && typeof playback.catch === "function") {
            playback.catch(() => {});
          }
        } else {
          video.onended = null;
          video.onerror = null;
          video.pause();
          try { video.currentTime = 0; } catch (err) { /* 忽略 */ }
        }
      });
      schedule();
    }

    function stopSoundtrackFallbacks() {
      window.removeEventListener("pointerdown", startSoundtrack);
      window.removeEventListener("keydown", startSoundtrack);
      window.removeEventListener("touchstart", startSoundtrack);
    }

    function startSoundtrack() {
      if (!soundtrack.paused) {
        stopSoundtrackFallbacks();
        return;
      }
      soundtrack.volume = 0.72;
      const playback = soundtrack.play();
      if (playback && typeof playback.then === "function") {
        playback.then(stopSoundtrackFallbacks).catch(() => {});
      } else if (playback && typeof playback.catch === "function") {
        playback.catch(() => {});
      }
    }

    window.addEventListener("pointerdown", startSoundtrack);
    window.addEventListener("keydown", startSoundtrack);
    window.addEventListener("touchstart", startSoundtrack);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && soundtrack.paused) startSoundtrack();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
    });

    window.addEventListener("resize", fit);
    window.addEventListener("orientationchange", fit);
    buildSlides();
    fit();
    startSoundtrack();
    show(current);
  </script>
</body>
</html>
